<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruta Perú · Tu itinerario en Lima</title>
  <meta name="description" content="Planificador de itinerarios para turistas en Lima, Perú: días, vuelos, comidas y traslados.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true">🦙</span>
        <span>Ruta Perú</span>
        <small data-i18n="tagline"></small>
      </a>
      <div class="top-actions">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1 data-i18n="heroTitle"></h1>
        <p data-i18n="heroText"></p>
      </div>
    </section>

    <section class="wrap">
      <form id="planner-form" class="card form wizard" novalidate>
        <div class="wizard-progress">
          <span id="wizard-count"></span>
          <div class="bar" aria-hidden="true"><i id="wizard-bar"></i></div>
        </div>

        <fieldset class="step" data-step="with">
          <legend data-i18n="q.with"></legend>
          <div class="options">
            <label class="option">
              <input type="radio" name="travelWith" value="solo">
              <span><b class="option-icon" aria-hidden="true">🧳</b><strong data-i18n="q.solo"></strong><em data-i18n="q.soloHint"></em></span>
            </label>
            <label class="option">
              <input type="radio" name="travelWith" value="couple">
              <span><b class="option-icon" aria-hidden="true">💑</b><strong data-i18n="q.couple"></strong><em data-i18n="q.coupleHint"></em></span>
            </label>
            <label class="option">
              <input type="radio" name="travelWith" value="friends">
              <span><b class="option-icon" aria-hidden="true">🎉</b><strong data-i18n="q.friends"></strong><em data-i18n="q.friendsHint"></em></span>
            </label>
            <label class="option">
              <input type="radio" name="travelWith" value="family">
              <span><b class="option-icon" aria-hidden="true">👨‍👩‍👧</b><strong data-i18n="q.family"></strong><em data-i18n="q.familyHint"></em></span>
            </label>
          </div>
        </fieldset>

        <fieldset class="step" data-step="first" hidden>
          <legend data-i18n="q.first"></legend>
          <div class="options">
            <label class="option">
              <input type="radio" name="firstTime" value="yes">
              <span><b class="option-icon" aria-hidden="true">✨</b><strong data-i18n="q.firstYes"></strong><em data-i18n="q.firstYesHint"></em></span>
            </label>
            <label class="option">
              <input type="radio" name="firstTime" value="no">
              <span><b class="option-icon" aria-hidden="true">🧭</b><strong data-i18n="q.firstNo"></strong><em data-i18n="q.firstNoHint"></em></span>
            </label>
          </div>
        </fieldset>

        <fieldset class="step" data-step="interests" hidden>
          <legend data-i18n="q.interests"></legend>
          <p class="step-hint muted" data-i18n="q.interestsHint"></p>
          <div class="chips" id="interests"></div>
        </fieldset>

        <fieldset class="step" data-step="style" hidden>
          <legend data-i18n="q.style"></legend>
          <div class="grid two">
            <div class="field">
              <span data-i18n="pace"></span>
              <div class="segmented">
                <label><input type="radio" name="pace" value="relaxed"><span data-i18n="relaxed"></span></label>
                <label><input type="radio" name="pace" value="moderate" checked><span data-i18n="moderate"></span></label>
                <label><input type="radio" name="pace" value="intense"><span data-i18n="intense"></span></label>
              </div>
            </div>
            <div class="field">
              <span data-i18n="budget"></span>
              <div class="segmented">
                <label><input type="radio" name="budget" value="low"><span data-i18n="low"></span></label>
                <label><input type="radio" name="budget" value="mid" checked><span data-i18n="mid"></span></label>
                <label><input type="radio" name="budget" value="high"><span data-i18n="high"></span></label>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="step" data-step="food" hidden>
          <legend data-i18n="q.food"></legend>
          <div class="options">
            <label class="option">
              <input type="radio" name="food" value="all">
              <span><b class="option-icon" aria-hidden="true">🍽️</b><strong data-i18n="q.foodAll"></strong><em data-i18n="q.foodAllHint"></em></span>
            </label>
            <label class="option">
              <input type="radio" name="food" value="noSeafood">
              <span><b class="option-icon" aria-hidden="true">🚫🦐</b><strong data-i18n="q.foodNoSeafood"></strong><em data-i18n="q.foodNoSeafoodHint"></em></span>
            </label>
          </div>
        </fieldset>

        <fieldset class="step" data-step="tour" hidden>
          <legend data-i18n="q.tour"></legend>
          <div class="tour-offer" id="tour-offer"></div>
          <div class="options">
            <label class="option">
              <input type="radio" name="wantsTour" value="yes">
              <span><b class="option-icon" aria-hidden="true">✅</b><strong data-i18n="q.tourYes"></strong></span>
            </label>
            <label class="option">
              <input type="radio" name="wantsTour" value="no">
              <span><b class="option-icon" aria-hidden="true">🚶</b><strong data-i18n="q.tourNo"></strong></span>
            </label>
          </div>
        </fieldset>

        <div class="step" data-step="trip" hidden>
            <fieldset>
              <legend data-i18n="stepCity"></legend>
              <div class="cities" id="cities">
                <label class="city">
                  <input type="radio" name="city" value="lima" checked>
                  <span><strong>Lima</strong><em>🌊 Costa</em></span>
                </label>
                <label class="city disabled">
                  <input type="radio" name="city" value="cusco" disabled>
                  <span><strong>Cusco</strong><em data-i18n="soon"></em></span>
                </label>
                <label class="city disabled">
                  <input type="radio" name="city" value="arequipa" disabled>
                  <span><strong>Arequipa</strong><em data-i18n="soon"></em></span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend data-i18n="stepTrip"></legend>
              <div class="grid">
                <label class="field">
                  <span data-i18n="arrivalDate"></span>
                  <input type="date" name="arrivalDate" required>
                </label>
                <label class="field">
                  <span data-i18n="arrivalTime"></span>
                  <input type="time" name="arrivalTime" value="08:00" required>
                </label>
                <label class="field">
                  <span data-i18n="days"></span>
                  <div class="stepper">
                    <button type="button" data-delta="-1" aria-label="-">−</button>
                    <input type="number" name="days" min="1" max="14" value="3" required>
                    <button type="button" data-delta="1" aria-label="+">+</button>
                  </div>
                </label>
                <label class="field">
                  <span data-i18n="departureTime"></span>
                  <input type="time" name="departureTime" value="22:00" required>
                  <small class="hint" id="early-hint" data-i18n="earlyHint" hidden></small>
                </label>
                <div class="field">
                  <span data-i18n="flightType"></span>
                  <div class="segmented">
                    <label><input type="radio" name="flightType" value="intl" checked><span data-i18n="intl"></span></label>
                    <label><input type="radio" name="flightType" value="dom"><span data-i18n="dom"></span></label>
                  </div>
                </div>
                <label class="field">
                  <span data-i18n="hotelZone"></span>
                  <select name="hotelZone" id="hotelZone"></select>
                </label>
              </div>
            </fieldset>

        </div>

        <p class="error" id="form-error" role="alert" hidden></p>
        <div class="wizard-nav">
          <button class="btn" type="button" id="wizard-back" data-i18n="q.back"></button>
          <button class="btn primary" type="button" id="wizard-next" data-i18n="q.next"></button>
          <button class="btn primary big" type="submit" id="wizard-submit" data-i18n="generate"></button>
        </div>
      </form>
    </section>

    <section class="wrap" id="result" hidden>
      <div class="result-head">
        <div>
          <h2 id="result-title"></h2>
          <p id="result-summary" class="muted"></p>
          <p id="result-persona" class="persona"></p>
        </div>
        <div class="actions">
          <button class="btn" type="button" id="btn-edit" data-i18n="edit"></button>
          <button class="btn" type="button" id="btn-regen" data-i18n="regenerate"></button>
          <button class="btn primary" type="button" id="btn-pdf" data-i18n="pdf"></button>
        </div>
      </div>
      <p class="pdf-status" id="pdf-status" role="status" hidden></p>
      <div id="warnings"></div>
      <div id="tour-card"></div>
      <nav class="day-tabs" id="day-tabs"></nav>
      <div id="days"></div>
      <div class="card total" id="total"></div>
      <div class="card tips">
        <h3 data-i18n="tipsTitle"></h3>
        <ul id="tips"></ul>
        <p class="muted small" data-i18n="disclaimer"></p>
      </div>
    </section>
    <section class="wrap admin" id="admin" hidden>
      <div class="admin-head">
        <div>
          <h2>Panel de administración</h2>
          <p class="muted" id="admin-mode"></p>
        </div>
        <button type="button" class="btn" id="admin-close">Ver la página pública</button>
      </div>
      <div class="card admin-gate" id="admin-gate" hidden></div>
      <div id="admin-body" hidden>
      <div class="admin-bar">
        <div class="admin-tabs" role="tablist">
          <button type="button" role="tab" data-admin-tab="attractions">Atracciones</button>
          <button type="button" role="tab" data-admin-tab="restaurants">Restaurantes</button>
          <button type="button" role="tab" data-admin-tab="tours">Tours</button>
          <button type="button" role="tab" data-admin-tab="settings">Ajustes</button>
        </div>
        <div class="admin-search">
          <input type="search" id="admin-search" placeholder="Buscar por nombre o zona" aria-label="Buscar">
        </div>
      </div>
      <div id="admin-list"></div>
      <div id="admin-editor" hidden></div>
      </div>
      <div class="admin-toast" id="admin-toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap" data-i18n="footer"></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data/lima.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pdf.js"></script>
</body>
</html>
